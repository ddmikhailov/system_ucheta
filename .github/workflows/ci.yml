name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # Сервер колледжа работает на Python 3.12, облачный запуск — на 3.14: проверяем обе границы поддерживаемого диапазона.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lock-файлы соответствуют requirements*.in
        if: matrix.python-version == '3.12'
        working-directory: backend
        run: |
          pip install uv==0.12.21
          uv pip compile requirements.in --universal --generate-hashes --python-version 3.12 -o requirements.txt -q
          uv pip compile requirements-dev.in --universal --generate-hashes --python-version 3.12 -c requirements.txt -o requirements-dev.txt -q
          git diff --exit-code -- requirements.txt requirements-dev.txt

      - name: pytest
        working-directory: backend
        env:
          JWT_SECRET: Ci4vXn8Lw2KzR7pYb5HdJ9cMfA3sUe6Gt
        run: pytest

      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --skip-editable

  backend-mysql:
    # Основной job гоняет тот же набор на SQLite (быстро, без сервисов) —
    # этот проверяет то, что SQLite не проверяет вообще: ENUM, strict mode,
    # длины строк, collation (см. TODO.md 5).
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: kait20_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Миграции на пустой MySQL (одна голова, upgrade, откат к прошлому релизу)
        working-directory: backend
        env:
          JWT_SECRET: Ci4vXn8Lw2KzR7pYb5HdJ9cMfA3sUe6Gt
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: kait20_migrate
        run: |
          heads=$(alembic heads | wc -l)
          if [ "$heads" -ne 1 ]; then alembic heads; echo "Голов миграций: $heads, должна быть одна"; exit 1; fi
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE kait20_migrate CHARACTER SET utf8mb4"
          alembic upgrade head
          # Откат к голове прошлого релиза и обратно — это шаги отката из памятки к выкладке.
          # При выпуске следующей версии сюда ставится голова только что выпущенной (3.6.0 — r1a2b3c4d5e6).
          alembic downgrade r1a2b3c4d5e6
          alembic upgrade head

      - name: pytest (MySQL)
        working-directory: backend
        env:
          JWT_SECRET: Ci4vXn8Lw2KzR7pYb5HdJ9cMfA3sUe6Gt
          TEST_DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/kait20_test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Тесты фронтенда (Vitest)
        working-directory: frontend
        run: npm test

      - name: tsc + vite build
        working-directory: frontend
        run: npm run build

      - name: oxlint
        working-directory: frontend
        run: npx oxlint

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  mobile:
    # Главные экраны куратора на ширине 375 px без горизонтальной прокрутки (Playwright): настоящий backend
    # на временной SQLite с синтетическими данными + собранный интерфейс (frontend/e2e/server.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          cd frontend && npm ci && npx playwright install --with-deps chromium

      - name: Сборка интерфейса
        working-directory: frontend
        run: npm run build

      - name: Экраны на 375 px
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run test:mobile
