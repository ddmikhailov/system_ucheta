name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lock-файлы соответствуют requirements*.in
        working-directory: backend
        run: |
          pip install uv==0.12.21
          uv pip compile requirements.in --universal --generate-hashes --python-version 3.14 -o requirements.txt -q
          uv pip compile requirements-dev.in --universal --generate-hashes --python-version 3.14 -c requirements.txt -o requirements-dev.txt -q
          git diff --exit-code -- requirements.txt requirements-dev.txt

      - name: pytest
        working-directory: backend
        env:
          JWT_SECRET: Ci4vXn8Lw2KzR7pYb5HdJ9cMfA3sUe6Gt
        run: pytest

      - name: pip-audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --skip-editable

  backend-mysql:
    # Основной job гоняет тот же набор на SQLite (быстро, без сервисов) —
    # этот проверяет то, что SQLite не проверяет вообще: ENUM, strict mode,
    # длины строк, collation (см. TODO.md 5).
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: kait20_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: pytest (MySQL)
        working-directory: backend
        env:
          JWT_SECRET: Ci4vXn8Lw2KzR7pYb5HdJ9cMfA3sUe6Gt
          TEST_DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/kait20_test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Тесты фронтенда (Vitest)
        working-directory: frontend
        run: npm test

      - name: tsc + vite build
        working-directory: frontend
        run: npm run build

      - name: oxlint
        working-directory: frontend
        run: npx oxlint

      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
