# Единое приложение (backend + встроенные бот/планировщик + статика
# фронтенда) плюс MySQL. Раньше здесь было 5 сервисов — frontend, bot и
# scheduler объединены внутрь app, см. README, раздел «Архитектура».
services:
  db:
    image: mysql:8.1.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-kait20}
      MYSQL_USER: ${DB_USER:-kait20}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-change-me-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  db_data:
