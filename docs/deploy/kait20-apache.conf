# Виртуальный хост Apache для платформы «Цифровой куратор».
# Apache — только HTTPS-вход и обратный прокси; интерфейс и API отдаёт
# одно приложение на 127.0.0.1:8000.
# Нужные модули: proxy, proxy_http, headers, ssl  (a2enmod proxy proxy_http headers ssl)
# Замените: kurator.example.ru, пути к сертификату и ключу.

<VirtualHost *:80>
    ServerName kurator.example.ru
    Redirect permanent / https://kurator.example.ru/
</VirtualHost>

<VirtualHost *:443>
    ServerName kurator.example.ru

    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/kurator.example.ru.crt
    SSLCertificateKeyFile /etc/ssl/private/kurator.example.ru.key
    SSLProtocol           -all +TLSv1.2 +TLSv1.3

    # ВСЕ пути — в приложение: оно само решает, отдать страницу интерфейса или данные API
    # (по заголовкам браузера Sec-Fetch-Dest/Accept). Отдельно раздавать файлы из Apache и
    # подменять ошибки (ProxyErrorOverride) нельзя — интерфейс перестанет открываться по прямым адресам.
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/ nocanon
    ProxyPassReverse / http://127.0.0.1:8000/

    # Схема исходного запроса: по ней приложение ставит Secure-cookie и HSTS.
    RequestHeader set X-Forwarded-Proto "https"

    # Выгрузки Excel/Word/PDF по большим спискам могут идти десятки секунд.
    ProxyTimeout 180
    # Размер загружаемых файлов (Excel с досье — до 5 МБ) проверяет само приложение и отвечает
    # понятным сообщением. LimitRequestBody в Apache не ставить: вместо отказа он даёт ошибку 500.

    # Заголовки безопасности (CSP, HSTS, X-Frame-Options) выставляет приложение — не дублировать.
    Header always unset X-Powered-By

    ErrorLog  ${APACHE_LOG_DIR}/kait20-error.log
    CustomLog ${APACHE_LOG_DIR}/kait20-access.log combined
</VirtualHost>
