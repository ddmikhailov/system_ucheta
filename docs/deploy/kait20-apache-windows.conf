# Виртуальный хост Apache 2.4 для Windows (Apache Lounge / Apache HTTP Server с официального сборщика).
# Сохраните как C:\Apache24\conf\extra\kait20.conf и подключите ОДНОЙ строкой в конце httpd.conf:
#     Include conf/extra/kait20.conf
# В httpd.conf должны быть раскомментированы (убрана «#» в начале) модули:
#     LoadModule proxy_module modules/mod_proxy.so
#     LoadModule proxy_http_module modules/mod_proxy_http.so
#     LoadModule headers_module modules/mod_headers.so
#     LoadModule ssl_module modules/mod_ssl.so
#     LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
# и строки Listen 80 / Listen 443. Замените kurator.example.ru и пути к сертификату (слэши — прямые «/»).

<VirtualHost *:80>
    ServerName kurator.example.ru
    Redirect permanent / https://kurator.example.ru/
</VirtualHost>

<VirtualHost *:443>
    ServerName kurator.example.ru

    SSLEngine on
    SSLCertificateFile    "C:/Apache24/conf/ssl/kurator.example.ru.crt"
    SSLCertificateKeyFile "C:/Apache24/conf/ssl/kurator.example.ru.key"
    SSLProtocol           -all +TLSv1.2 +TLSv1.3

    # ВСЕ пути — в приложение (оно само отличает страницу интерфейса от запроса данных).
    # Не раздавать файлы из Apache и не включать ProxyErrorOverride.
    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8000/ nocanon
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "https"
    ProxyTimeout 180
    # Размер загружаемых файлов проверяет приложение; LimitRequestBody не ставить (даёт ошибку 500).
    # Заголовки безопасности выставляет приложение — не дублировать.
    Header always unset X-Powered-By

    ErrorLog  "logs/kait20-error.log"
    CustomLog "logs/kait20-access.log" combined
</VirtualHost>
