[pytest]
pythonpath = .
testpaths = tests
markers =
    real_meal_task: не отключать создание еженедельной задачи «Подать питание» при опросе уведомлений
filterwarnings =
    # Устаревшие вызовы внутри starlette/fastapi/anyio на Python 3.14 — не
    # проблема нашего кода (см. TODO.md 5). Актуальные версии этих библиотек
    # уберут предупреждения сами; фиксировать версии ради одних только
    # warnings не стали.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:Using .httpx. with starlette.testclient is deprecated
