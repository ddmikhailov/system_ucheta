[pytest]
pythonpath = .
testpaths = tests
asyncio_default_fixture_loop_scope = function
filterwarnings =
    # Устаревшие вызовы внутри pytest-asyncio/starlette/fastapi/anyio на
    # Python 3.14 — не проблема нашего кода (см. TODO.md 5). Актуальные
    # версии этих библиотек уберут предупреждения сами; фиксировать версии
    # ради одних только warnings не стали.
    ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio
    ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:Using .httpx. with starlette.testclient is deprecated
